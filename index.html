<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presell Studio</title>
  <style>
    :root{--bg:#090d14;--panel:#121824;--panel2:#192131;--line:#2b3548;--text:#f5f7fb;--muted:#92a0b7;--accent:#ffb020;--danger:#ff6b6b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}
    button,input,select{font:inherit}.topbar{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#0c111b;position:sticky;top:0;z-index:10}
    .logo{font-weight:900}.logo span{display:inline-grid;place-items:center;width:34px;height:34px;border:1px solid var(--accent);border-radius:9px;color:var(--accent);margin-right:9px}
    .tabs{display:flex;gap:6px}.tabs button{background:transparent;color:var(--muted);border:0;padding:10px 14px;border-radius:8px;cursor:pointer}.tabs button.active{background:var(--panel2);color:var(--text)}
    .tabs small{background:#293247;padding:2px 6px;border-radius:10px;margin-left:4px}.saved{font-size:12px;color:var(--muted)}.saved:before{content:"";display:inline-block;width:7px;height:7px;background:#43d19e;border-radius:50%;margin-right:7px}
    .wrap{width:100%;max-width:none;margin:0;padding:18px}.hero{display:none}.kicker{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:800}.hero h1,.draft-head h1{font-size:clamp(30px,5vw,48px);margin:8px 0}.hero p,.draft-head p{color:var(--muted);line-height:1.6}
    .builder{display:grid;grid-template-columns:390px minmax(0,1fr);gap:18px;align-items:stretch}.card,.preview-card,.draft{background:var(--panel);border:1px solid var(--line);border-radius:14px}
    .card{height:calc(100vh - 104px);padding:20px;overflow-y:auto}.step-title{display:flex;gap:12px;align-items:center;margin-bottom:17px}.step-title b{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--accent);color:var(--accent);border-radius:8px}.step-title h2{font-size:18px;margin:0}.step-title p{font-size:12px;color:var(--muted);margin:4px 0 0}
    label{display:block;font-size:11px;font-weight:800;letter-spacing:.09em;color:#b6c8e5;margin:15px 0 7px;text-transform:uppercase}input,select{width:100%;padding:13px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--text);outline:none}input:focus,select:focus{border-color:var(--accent)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.types{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.type{padding:13px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--text);cursor:pointer;text-align:left}.type.active{border-color:var(--accent);color:var(--accent)}
    .buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.card>.buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card>.buttons .btn{width:100%;height:46px;padding:0 10px;font-size:12px;white-space:nowrap}.btn{border:1px solid transparent;border-radius:9px;padding:12px 17px;font-weight:800;cursor:pointer;background:var(--accent);color:#151000;transition:border-color .18s,background .18s,transform .18s,opacity .18s}.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.05)}.btn.secondary{background:var(--panel2);border-color:var(--line);color:var(--text)}.btn.secondary:hover:not(:disabled){border-color:#526079}.btn.danger{color:var(--danger)}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
    .preview-card{overflow:hidden;height:calc(100vh - 104px);min-height:560px}.browser{height:42px;background:#202838;display:flex;align-items:center;gap:6px;padding:0 12px}.browser i{width:9px;height:9px;background:#576177;border-radius:50%}.browser div{margin-left:8px;background:#111722;color:var(--muted);font-size:10px;padding:6px 10px;border-radius:6px;flex:1}.preview-card iframe{display:block;width:100%;height:calc(100% - 42px);border:0;background:white}
    .draft-page{display:none}.draft-page.active{display:block}.builder-page.hidden{display:none}.draft-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.draft-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.draft{padding:18px}.draft h2{font-size:17px;margin:0 0 6px}.draft p{font-size:12px;color:var(--muted);margin:4px 0}.draft .buttons{margin-top:15px;gap:7px}.draft .btn{padding:9px 11px;font-size:11px}.empty{border:1px dashed var(--line);border-radius:14px;padding:45px;text-align:center;color:var(--muted);grid-column:1/-1}
    .status{font-size:12px;color:#54d6ae;margin-top:12px;min-height:18px}.color-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.color-row input[type=color]{height:44px;padding:3px}
    @media(max-width:900px){.builder{grid-template-columns:1fr}.card{height:auto;overflow:visible}.preview-card{height:70vh;min-height:520px}.draft-grid{grid-template-columns:1fr 1fr}.saved{display:none}}@media(max-width:600px){.topbar{padding:0 12px}.logo{font-size:0}.logo span{font-size:14px}.wrap{padding:12px}.grid2,.types,.draft-grid{grid-template-columns:1fr}.preview-card{height:65vh;min-height:470px}.draft-head{align-items:start;flex-direction:column}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo"><span>PS</span>Presell Studio</div>
    <nav class="tabs">
      <button id="builderTab" class="active">Criar presell</button>
      <button id="draftTab">Rascunhos <small id="draftCount">0</small></button>
    </nav>
    <div class="saved">Salvo no dispositivo</div>
  </header>

  <main class="wrap">
    <section id="builderPage" class="builder-page">
      <div class="hero"><div class="kicker">GERADOR DE PRESELLS</div><h1>Crie sua página em minutos.</h1><p>Configure, visualize e baixe uma presell pronta em HTML.</p></div>
      <div class="builder">
        <div class="card">
          <div class="step-title"><b>01</b><div><h2>Configuração</h2><p>Informe o produto, destino e idioma.</p></div></div>
          <label for="product">Nome do produto</label>
          <input id="product" value="Nome do produto">
          <label for="affiliate">Link de afiliado</label>
          <input id="affiliate" value="https://seu-link-de-afiliado.com">
          <div class="grid2">
            <div><label for="language">Idioma</label><select id="language"><option value="en">Inglês</option><option value="pt">Português</option><option value="es">Espanhol</option></select></div>
            <div><label for="layout">Tipo de presell</label><select id="layout"><option value="popup">PopUp</option><option value="review">Review</option><option value="robust">Robusta</option></select></div>
          </div>
          <label for="interaction">Tipo de interação</label>
          <select id="interaction">
            <option value="cookies">Cookies</option>
            <option value="country">Seleção de país</option>
            <option value="gender">Seleção de gênero</option>
            <option value="age">Verificação de idade</option>
            <option value="discount">Gatilho de desconto</option>
            <option value="captcha">Captcha</option>
          </select>
          <label>Cor de destaque</label>
          <div class="color-row"><input type="color" id="accent" value="#ffb020"><input id="accentText" value="#ffb020"></div>
          <div class="buttons">
            <button class="btn" id="generateBtn">Gerar presell</button>
            <button class="btn secondary" id="previewBtn" disabled>Visualizar página</button>
            <button class="btn secondary" id="saveBtn">Salvar novo</button>
            <button class="btn secondary" id="updateBtn">Atualizar rascunho</button>
            <button class="btn secondary" id="downloadBtn" disabled>Baixar HTML</button>
          </div>
          <div class="status" id="status"></div>
        </div>
        <div class="preview-card">
          <div class="browser"><i></i><i></i><i></i><div id="address">presell.com</div></div>
          <iframe id="preview" title="Visualização da presell"></iframe>
        </div>
      </div>
    </section>

    <section id="draftPage" class="draft-page">
      <div class="draft-head"><div><div class="kicker">SEUS PROJETOS</div><h1>Rascunhos</h1><p>Abra um projeto salvo para continuar de onde parou.</p></div><button class="btn" id="newBtn">Novo projeto</button></div>
      <div class="draft-grid" id="draftGrid"></div>
    </section>
  </main>

  <script>
    "use strict";
    const KEY="presell-studio-drafts-v1";
    const $=id=>document.getElementById(id);
    const state={activeId:null,drafts:[],output:""};
    const texts={
      pt:{title:"Antes de continuar",body:"Confirme suas preferências para acessar o conteúdo.",cta:"Continuar para o site",cookie:"Utilizamos cookies para melhorar sua experiência.",accept:"Aceitar e continuar"},
      en:{title:"Before you continue",body:"Confirm your preferences to access the content.",cta:"Continue to website",cookie:"We use cookies to improve your experience.",accept:"Accept and continue"},
      es:{title:"Antes de continuar",body:"Confirma tus preferencias para acceder al contenido.",cta:"Continuar al sitio",cookie:"Usamos cookies para mejorar tu experiencia.",accept:"Aceptar y continuar"}
    };
    function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
    function safeUrl(v){try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:"#"}catch{return "#"}}
    function values(){return{product:$("product").value.trim()||"Projeto sem nome",affiliateUrl:$("affiliate").value.trim(),language:$("language").value,layout:$("layout").value,type:$("interaction").value,accent:$("accent").value}}
    function generatedHtml(data=values()){
      const t=texts[data.language]||texts.en,url=safeUrl(data.affiliateUrl),product=esc(data.product),accent=esc(data.accent);
      const background=`<iframe class="site-bg" src="${url}" title="Página de destino"></iframe><div class="guard"></div>`;
      let interaction="";
      if(data.type==="cookies") interaction=`<div class="cookie"><div><strong>${t.title}</strong><p>${t.cookie}</p></div><button onclick="go()">${t.accept}</button></div>`;
      else {
        const options=data.type==="country"?["United States","Canada","United Kingdom"]:data.type==="gender"?["Female","Male","Prefer not to say"]:data.type==="age"?["I am 18 or older","I am under 18"]:data.type==="discount"?["Unlock my discount"]:data.type==="captcha"?["✓ I am not a robot"]:["Continue"];
        interaction=`<div class="shade"><div class="modal"><span class="tag">${product}</span><h2>${t.title}</h2><p>${t.body}</p><div class="choices">${options.map(o=>`<button onclick="go()">${o}</button>`).join("")}</div><button class="skip" onclick="go()">${t.cta}</button></div></div>`;
      }
      return `<!DOCTYPE html><html lang="${data.language}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${product}</title><style>:root{--a:${accent}}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,sans-serif}.site-bg{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}.guard{position:fixed;inset:0;background:rgba(5,8,14,.16)}.shade{position:fixed;inset:0;display:grid;place-items:center;padding:15px;background:rgba(3,6,12,.55);backdrop-filter:blur(2px)}.modal{width:min(360px,calc(100% - 20px));background:#171c27;color:#f5f7fb;border:1px solid #39445a;border-radius:16px;padding:23px;text-align:center;box-shadow:0 24px 70px #000}.tag{color:var(--a);font-size:10px;font-weight:900;letter-spacing:.14em}.modal h2{font-size:21px;margin:10px 0}.modal p,.cookie p{color:#9aa7bb;font-size:13px}.choices{display:grid;gap:8px;margin-top:15px}.choices button,.cookie button{border:0;background:var(--a);color:#111;border-radius:9px;padding:12px;font-weight:800;cursor:pointer}.skip{border:0;background:none;color:#9aa7bb;margin-top:12px;cursor:pointer}.cookie{position:fixed;z-index:3;bottom:14px;left:14px;right:14px;max-width:800px;margin:auto;background:#171c27;color:#fff;border:1px solid #39445a;border-radius:13px;padding:14px 17px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:0 18px 50px #000}.cookie p{margin:4px 0 0}@media(max-width:520px){.cookie{align-items:stretch;flex-direction:column}}</style></head><body>${background}${interaction}<script>function go(){const affiliateUrl=${JSON.stringify(url)};if(!affiliateUrl||affiliateUrl==="#")return;if(window.self!==window.top){window.open(affiliateUrl,"_blank","noopener,noreferrer")}else{window.location.assign(affiliateUrl)}}<\/script></body></html>`;
    }
    function setGeneratedReady(ready){
      $("previewBtn").disabled=!ready;
      $("downloadBtn").disabled=!ready;
      $("downloadBtn").classList.toggle("secondary",!ready);
    }
    function invalidate(){
      state.output="";
      setGeneratedReady(false);
      const data=values();
      $("address").textContent=(data.product.toLowerCase().replace(/\s+/g,"")||"presell")+".com";
      $("preview").srcdoc=generatedHtml(data);
    }
    function generate(){
      if(safeUrl(values().affiliateUrl)==="#"){alert("Digite um link de afiliado válido antes de gerar.");$("affiliate").focus();return}
      state.output=generatedHtml();
      $("preview").srcdoc=state.output;
      setGeneratedReady(true);
      message("Presell gerada. O download está liberado.");
    }
    function persist(){localStorage.setItem(KEY,JSON.stringify(state.drafts));renderDrafts()}
    function norm(s){return s.trim().replace(/\s+/g," ").toLocaleLowerCase("pt-BR")}
    function save(mode="new"){
      const data=values(),current=mode==="update"?state.drafts.find(d=>d.id===state.activeId):null;
      if(safeUrl(data.affiliateUrl)==="#"){alert("O link de afiliado é obrigatório. Digite um endereço válido antes de salvar.");$("affiliate").focus();return false}
      if(mode==="update"&&!current){alert("Abra um rascunho antes de atualizar.");return false}
      const duplicate=state.drafts.find(d=>d.id!==current?.id&&norm(d.product)===norm(data.product));
      if(duplicate&&!confirm(`Já existe um rascunho com o nome “${data.product}”. Deseja substituí-lo?`))return false;
      if(current&&!duplicate&&!confirm(`Atualizar o rascunho “${current.product}”? A versão salva será substituída.`))return false;
      const target=duplicate||current,now=new Date().toISOString(),saved={...data,id:target?.id||crypto.randomUUID(),createdAt:target?.createdAt||now,updatedAt:now};
      state.drafts=target?state.drafts.filter(d=>!current||current.id===target.id||d.id!==current.id).map(d=>d.id===target.id?saved:d):[saved,...state.drafts];
      state.activeId=saved.id;persist();message(duplicate?"Rascunho substituído.":current?"Rascunho atualizado.":"Novo rascunho salvo.");return true
    }
    function loadDraft(d){$("product").value=d.product;$("affiliate").value=d.affiliateUrl;$("language").value=d.language;$("layout").value=d.layout;$("interaction").value=d.type;$("accent").value=d.accent;$("accentText").value=d.accent;state.activeId=d.id;showBuilder();invalidate()}
    function renderDrafts(){
      $("draftCount").textContent=state.drafts.length;
      $("draftGrid").innerHTML=state.drafts.length?state.drafts.map(d=>`<article class="draft"><h2>${esc(d.product)}</h2><p>${esc(d.layout)} · ${esc(d.language)}</p><p>Atualizado em ${new Date(d.updatedAt).toLocaleString("pt-BR")}</p><div class="buttons"><button class="btn secondary" data-open="${d.id}">Abrir</button><button class="btn secondary" data-view="${d.id}">Visualizar</button><button class="btn secondary danger" data-delete="${d.id}">Excluir</button></div></article>`).join(""):`<div class="empty">Nenhum rascunho salvo.</div>`;
    }
    function message(v){$("status").textContent=v;setTimeout(()=>$("status").textContent="",1800)}
    function showBuilder(){$("builderPage").classList.remove("hidden");$("draftPage").classList.remove("active");$("builderTab").classList.add("active");$("draftTab").classList.remove("active")}
    function showDrafts(){$("builderPage").classList.add("hidden");$("draftPage").classList.add("active");$("builderTab").classList.remove("active");$("draftTab").classList.add("active");renderDrafts()}
    function openPreview(html=state.output){if(!html)return;const blob=new Blob([html],{type:"text/html"}),u=URL.createObjectURL(blob);window.open(u,"_blank","noopener,noreferrer");setTimeout(()=>URL.revokeObjectURL(u),60000)}
    function download(){if(!state.output)return;const blob=new Blob([state.output],{type:"text/html;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(values().product.toLowerCase().replace(/[^a-z0-9]+/gi,"-")||"presell")+".html";a.click();URL.revokeObjectURL(a.href)}
    document.querySelectorAll("input,select").forEach(e=>e.addEventListener("input",()=>{if(e.id==="accent")$("accentText").value=e.value;if(e.id==="accentText"&&/^#[0-9a-f]{6}$/i.test(e.value))$("accent").value=e.value;invalidate()}));
    $("builderTab").onclick=showBuilder;$("draftTab").onclick=showDrafts;$("generateBtn").onclick=generate;$("previewBtn").onclick=()=>openPreview();$("saveBtn").onclick=()=>save("new");$("updateBtn").onclick=()=>save("update");$("downloadBtn").onclick=download;
    $("newBtn").onclick=()=>{$("product").value="Nome do produto";$("affiliate").value="https://seu-link-de-afiliado.com";$("interaction").value="cookies";state.activeId=null;showBuilder();invalidate()};
    $("draftGrid").onclick=e=>{const id=e.target.dataset.open||e.target.dataset.view||e.target.dataset.delete;if(!id)return;const d=state.drafts.find(x=>x.id===id);if(e.target.dataset.open)loadDraft(d);if(e.target.dataset.view)openPreview(generatedHtml(d));if(e.target.dataset.delete&&confirm(`Excluir o rascunho “${d.product}”?`)){state.drafts=state.drafts.filter(x=>x.id!==id);if(state.activeId===id)state.activeId=null;persist()}};
    try{state.drafts=JSON.parse(localStorage.getItem(KEY)||"[]")}catch{state.drafts=[]}renderDrafts();invalidate();
  </script>
</body>
</html>
